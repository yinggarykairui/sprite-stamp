<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sprite-stamp</title>
<!-- Inline empty icon: keeps the browser from requesting /favicon.ico. -->
<link rel="icon" href="data:,">
<style>
  :root {
    --ink: #17181a;
    --paper: #ffffff;
    --muted: #686e77;
    --line: #8c929b;
    --bg: #fafbfc;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    /* 12px sides, so the 256px minimum board still clears a 280px viewport
       without a horizontal scrollbar. The column stays centred either way. */
    padding: 16px 12px;
    background: var(--bg);
    color: var(--ink);
    font: 400 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    /* min-height, never a fixed height: a taller column still scrolls. */
    min-height: 100vh;
  }
  .wrap {
    width: 100%;
    max-width: 420px;
    /* auto margins centre on both axes and collapse to 0 when space runs out,
       so a column taller than the viewport scrolls instead of being clipped. */
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  /* Every row is exactly as wide as the board, so the page has one left edge.
     --board is published by measure(); the fallback covers the first paint. */
  .hdr, .palette, .row, .status {
    width: var(--board, 100%);
    max-width: 100%;
    margin-left: auto;
    margin-right: auto;
  }
  .hdr {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .hdr .name { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .hdr .dims { font-size: 13px; color: var(--muted); }
  .boardwrap { display: flex; justify-content: center; }
  #board {
    display: block;
    /* touch-action lives on the canvas only, so the page still scrolls. */
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    /* box-shadow, not border: it must not enter getBoundingClientRect(). */
    box-shadow: 0 0 0 1px var(--line);
    cursor: crosshair;
  }
  .palette {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }
  .sw {
    height: 40px;
    min-width: 0;
    padding: 0;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  /* Two-tone ring: inner paper gap, outer ink — reads on black and on white. */
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
  .sw.hairline { box-shadow: inset 0 0 0 1px var(--line); }
  .sw.hairline[aria-pressed="true"] {
    box-shadow: inset 0 0 0 1px var(--line), 0 0 0 2px var(--paper), 0 0 0 4px var(--ink);
  }
  .row { display: grid; gap: 8px; }
  .row.tools { grid-template-columns: 1fr 1fr; }
  .row.actions { grid-auto-flow: column; grid-auto-columns: 1fr; }
  .btn {
    height: 44px;
    padding: 0 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .btn[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  /* Toggles wear a pill track and read empty when off, so a stranger can tell
     the two modes from the three actions before pressing anything. */
  .row.tools .btn { border-radius: 22px; }
  .row.tools .btn[aria-pressed="false"] { background: transparent; }
  .btn:disabled { color: var(--muted); cursor: default; }
  .btn:focus-visible, .sw:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* A disabled Undo must not darken under the cursor: it was reading as the
     loudest of the three actions while being the only dead one. */
  .btn:hover:not(:disabled) { border-color: var(--ink); }
  .btn, .sw { transition: transform 90ms ease; }
  .btn:active, .sw:active { transform: scale(.97); }
  @media (prefers-reduced-motion: reduce) {
    .btn, .sw { transition: none; }
    .btn:active, .sw:active { transform: none; }
  }
  .scrim {
    position: fixed;
    inset: 0;
    z-index: 10;
    padding: 16px;
    background: rgba(23, 24, 26, .55);
    display: flex;
    /* flex-start + margin:auto centres the panel but never pushes its top out
       of reach when the panel is taller than the scrim. */
    align-items: flex-start;
    justify-content: center;
    overflow: auto;
  }
  .scrim[hidden] { display: none; }
  .panel {
    background: var(--paper);
    border-radius: 12px;
    padding: 16px;
    margin: auto;
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .panel h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .shot {
    /* Square at any panel width, and flush with the buttons under it. */
    width: 100%;
    /* height:auto is required, or the height="256" attribute wins and
       aspect-ratio never applies. */
    height: auto;
    aspect-ratio: 1;
    /* A landscape phone is shorter than a 320px preview plus the buttons under
       it. The cap is on the width, because Chrome clamps a max-height without
       giving the width back and the preview would be squashed; with
       aspect-ratio the height follows the width, so this caps both. */
    max-width: 42vh;
    display: block;
    image-rendering: pixelated;
    background-color: #f1f2f4;
    background-image:
      linear-gradient(45deg, #e2e5e9 25%, transparent 25%, transparent 75%, #e2e5e9 75%),
      linear-gradient(45deg, #e2e5e9 25%, transparent 25%, transparent 75%, #e2e5e9 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
    box-shadow: 0 0 0 1px var(--line);
  }
  .dl {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }
  /* The primary action at the one shareable moment: same inverted ink the
     pressed toggles already use, so Close stays the quiet one. */
  #download {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .hint { margin: 0; font-size: 12px; line-height: 1.4; color: var(--muted); text-align: center; }
  .status {
    margin: 0 auto;
    min-height: 20px;
    font-size: 13px;
    line-height: 20px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="hdr">
      <span class="name">sprite-stamp</span>
      <span class="dims">16 &times; 16</span>
    </header>

    <div class="boardwrap">
      <canvas id="board" aria-label="16 by 16 pixel board. Pointer only: tap or drag to paint. There is no keyboard painting; the buttons below are focusable."></canvas>
    </div>

    <div class="palette" id="palette" role="group" aria-label="Palette"></div>

    <div class="row tools">
      <button type="button" class="btn" id="erase" aria-pressed="false">Erase</button>
      <button type="button" class="btn" id="mirror" aria-pressed="false">Mirror</button>
    </div>

    <div class="row actions">
      <button type="button" class="btn" id="undo" disabled>Undo</button>
      <button type="button" class="btn" id="clear">Clear</button>
      <button type="button" class="btn" id="export" aria-label="Export PNG">Export</button>
    </div>

    <p class="status" id="status" aria-live="polite">Tap or drag to paint.</p>
  </div>

  <div class="scrim" id="scrim" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="paneltitle">
      <h2 id="paneltitle">Export</h2>
      <img class="shot" id="shot" width="256" height="256" alt="The sprite at 256 by 256 pixels">
      <a class="btn dl" id="download" download="sprite.png" href="#">Download sprite.png</a>
      <p class="hint" id="hint" aria-live="polite">On a phone you can also press and hold the image to save it.</p>
      <button type="button" class="btn dl" id="close">Close</button>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* ---------- constants ---------- */

  var GRID = 16;
  /* 16 x 16 = the 256 CSS px board the spec sets as the floor. */
  var MIN_CELL = 16;
  /* Vertical space the rest of the page needs; the board takes what is left. */
  var CHROME = 332;
  var CHECK_A = '#f1f2f4';
  var CHECK_B = '#e2e5e9';

  var PALETTE = Object.freeze([
    null,
    '#17181a', '#4a4f57', '#8c929b', '#ffffff',
    '#b23a34', '#e0714a', '#f0c04c', '#7fae4a',
    '#2f7d5c', '#3f9aa8', '#3f63b5', '#7a54a3'
  ]);

  /* Parallel to PALETTE, so a swatch announces its colour and not its number. */
  var COLOUR_NAMES = Object.freeze([
    null,
    'Black', 'Dark grey', 'Grey', 'White',
    'Red', 'Orange', 'Yellow', 'Green',
    'Dark green', 'Teal', 'Blue', 'Purple'
  ]);

  /* ---------- state: one array is the truth ---------- */

  var state = {
    pixels: new Uint8Array(GRID * GRID),
    color: 1,
    erase: false,
    mirror: false,
    undo: null
  };

  var layout = { cell: 0, cssPx: 0, dpr: 0 };

  /* ---------- persistence: everything read back is hostile ---------- */

  var STORE_KEY = 'sprite-stamp/v1';
  /* A real record is a few hundred characters; anything huge is junk. */
  var MAX_RAW = 100000;

  function loadState() {
    var raw = null;
    try {
      raw = window.localStorage.getItem(STORE_KEY);
    } catch (e) { return; }
    if (typeof raw !== 'string' || raw.length === 0 || raw.length > MAX_RAW) { return; }

    var data = null;
    try {
      data = JSON.parse(raw);
    } catch (e) { return; }
    if (!data || typeof data !== 'object' || Array.isArray(data)) { return; }
    /* Only the encoding this build writes. A future v2 record must start
       empty rather than be read as if it were v1. */
    if (data.v !== 1) { return; }

    /* Scanned whole before anything is written: a record with one bad
       character is a bad record, not a board with one bad cell. Repairing it
       per character used to load "zzzz" + 252 digits as a 252-cell sprite. */
    var pixels = data.pixels;
    if (typeof pixels === 'string' && pixels.length === GRID * GRID) {
      var vals = new Uint8Array(GRID * GRID);
      var ok = true;
      for (var i = 0; i < GRID * GRID; i++) {
        var v = parseInt(pixels.charAt(i), 16);
        if (!(v >= 0 && v <= 12)) { ok = false; break; }
        vals[i] = v;
      }
      if (ok) { state.pixels.set(vals); }
    }

    var color = Math.floor(Number(data.color));
    state.color = (isFinite(color) && color >= 1 && color <= 12) ? color : 1;
    state.mirror = data.mirror === true;
    state.erase = data.erase === true;
  }

  function saveState() {
    var out = '';
    for (var i = 0; i < GRID * GRID; i++) {
      out += state.pixels[i].toString(16);
    }
    try {
      window.localStorage.setItem(STORE_KEY, JSON.stringify({
        v: 1,
        pixels: out,
        color: state.color,
        mirror: state.mirror,
        erase: state.erase
      }));
    } catch (e) { /* private mode and quota both throw; the board still works. */ }
  }

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var boardwrap = canvas.parentNode;

  /* ---------- layout ---------- */

  function measure() {
    var availW = boardwrap.clientWidth || (GRID * MIN_CELL);
    var availH = window.innerHeight - CHROME;
    var byW = Math.floor(availW / GRID);
    var byH = Math.floor(availH / GRID);
    var cell = Math.min(byW, byH);
    /* Once height alone would push the cell under the floor, height stops
       deciding — but it still caps the cell, so the board never *grows* as the
       viewport shrinks. Below the floor the board sits at 16 px cells and the
       page scrolls, which is what the spec asks for on a short viewport. */
    if (!isFinite(cell) || cell < MIN_CELL) {
      cell = Math.min(byW, Math.max(MIN_CELL, byH));
    }
    if (!isFinite(cell)) { cell = MIN_CELL; }
    /* No upper clamp: .wrap's 420px max-width already caps the cell at 26. */
    cell = Math.max(MIN_CELL, cell);

    var cssPx = cell * GRID;
    /* Published so every row can be exactly as wide as the board. */
    document.documentElement.style.setProperty('--board', cssPx + 'px');
    var dpr = window.devicePixelRatio || 1;

    /* Rebuild the backing store when either the CSS size or the dpr moved. */
    if (cssPx !== layout.cssPx || dpr !== layout.dpr) {
      canvas.style.width = cssPx + 'px';
      canvas.style.height = cssPx + 'px';
      canvas.width = Math.round(cssPx * dpr);
      canvas.height = Math.round(cssPx * dpr);
      layout.cell = cell;
      layout.cssPx = cssPx;
      layout.dpr = dpr;
    }
    /* Reset first, or the scale compounds on every resize. */
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(layout.dpr, layout.dpr);
  }

  /* ---------- render: the only thing that draws the board ---------- */

  function render() {
    var c = layout.cell;
    var size = layout.cssPx;
    var x, y, v, px, py;

    ctx.clearRect(0, 0, size, size);

    for (y = 0; y < GRID; y++) {
      for (x = 0; x < GRID; x++) {
        v = state.pixels[y * GRID + x];
        px = x * c;
        py = y * c;
        if (v === 0) {
          /* One checker square per cell: at half-cell period the empty board
             read as 32 columns and the first tap landed on a cell twice the
             size the eye had aimed at. */
          ctx.fillStyle = ((x + y) & 1) ? CHECK_B : CHECK_A;
          ctx.fillRect(px, py, c, c);
        } else {
          ctx.fillStyle = PALETTE[v];
          ctx.fillRect(px, py, c, c);
        }
      }
    }

    /* One ink hairline vanishes over the dark half of the palette — over black
       it measured 1.00:1, no line at all — and one white hairline vanishes over
       the light half. So the grid is stroked twice in alternating dashes, the
       trick the mirror axis already uses: whichever pass the fill swallows, the
       other one reads. Still one pixel wide, so it stays quiet. */
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    for (var i = 1; i < GRID; i++) {
      var p = i * c + 0.5;
      ctx.moveTo(p, 0); ctx.lineTo(p, size);
      ctx.moveTo(0, p); ctx.lineTo(size, p);
    }
    ctx.lineDashOffset = 0;
    ctx.strokeStyle = 'rgba(23,24,26,0.45)';
    ctx.stroke();
    ctx.lineDashOffset = 4;
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;

    if (state.mirror) {
      /* Alternating light/dark dashes, so the axis reads over any colour. */
      var ax = 8 * c;
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.lineDashOffset = 0;
      ctx.strokeStyle = 'rgba(23,24,26,0.85)';
      ctx.beginPath(); ctx.moveTo(ax, 0); ctx.lineTo(ax, size); ctx.stroke();
      ctx.lineDashOffset = 6;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.moveTo(ax, 0); ctx.lineTo(ax, size); ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineDashOffset = 0;
      ctx.lineWidth = 1;
    }
  }

  /* ---------- status line ---------- */

  var RESTING = 'Tap or drag to paint.';
  var RESTING_ERASE = 'Erasing.';
  var RESTING_MIRROR = 'Mirror on: both halves paint together.';
  var RESTING_ERASE_MIRROR = 'Erasing. Mirror on: both halves erase together.';
  var statusEl = document.getElementById('status');
  var statusTimer = 0;

  /* The resting line is derived from state, not a constant: while erase or
     mirror is on the page's only instruction has to say so, including after a
     reload and after a transient message times out. The mirror sentence is the
     one explanation of the dashed axis, so it rests here rather than expiring
     after 2.4 seconds; erase leads when both are on, because it changes what
     the next tap does. */
  function restingText() {
    if (state.erase) { return state.mirror ? RESTING_ERASE_MIRROR : RESTING_ERASE; }
    return state.mirror ? RESTING_MIRROR : RESTING;
  }

  function setStatus(text) {
    statusEl.textContent = text;
    if (statusTimer) { clearTimeout(statusTimer); statusTimer = 0; }
    if (text !== restingText()) {
      statusTimer = setTimeout(function () {
        statusEl.textContent = restingText();
        statusTimer = 0;
      }, 2400);
    }
  }

  /* ---------- writing ---------- */

  /* The only function that mutates board content. Mirror is a write,
     not a view: the twin at 15 - x is written here and nowhere else. */
  function write(x, y, value) {
    var changed = poke(x, y, value);
    if (state.mirror && poke(GRID - 1 - x, y, value)) { changed = true; }
    return changed;
  }

  function poke(x, y, value) {
    if (x < 0 || x >= GRID || y < 0 || y >= GRID) { return false; }
    if (state.pixels[y * GRID + x] === value) { return false; }
    state.pixels[y * GRID + x] = value;
    return true;
  }

  /* Bresenham, so a fast drag leaves no gaps. */
  function line(x0, y0, x1, y1, value) {
    var dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
    var dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    var err = dx + dy, e2;
    var changed = false;
    for (;;) {
      if (write(x0, y0, value)) { changed = true; }
      if (x0 === x1 && y0 === y1) { break; }
      e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
    return changed;
  }

  /* ---------- pointer ---------- */

  /* How far outside the board a sample is allowed to sit. The line walker runs
     through these coordinates, so they have to stay small enough that a pointer
     flung across the desktop cannot make it iterate for long; poke() drops
     everything outside 0..15 anyway. */
  var CELL_BOUND = 64;

  function boundCell(v) {
    if (!isFinite(v)) { return -CELL_BOUND; }
    return Math.max(-CELL_BOUND, Math.min(GRID - 1 + CELL_BOUND, v));
  }

  /* Always from the live rect; never from a stored cell constant. Out-of-range
     samples are kept, not discarded: a drag that leaves the board still has to
     paint the cells it crossed on the way out, and poke() skips the rest. */
  function cellFromPointer(ev) {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width) { return null; }
    var size = rect.width / GRID;
    var x = Math.floor((ev.clientX - rect.left) / size);
    var y = Math.floor((ev.clientY - rect.top) / size);
    return { x: boundCell(x), y: boundCell(y) };
  }

  var stroke = { active: false, id: -1, last: null, changed: false, before: null };

  function strokeValue() {
    return state.erase ? 0 : state.color;
  }

  function beginStroke(ev) {
    if (stroke.active) { return; }
    stroke.active = true;
    stroke.id = ev.pointerId;
    stroke.last = null;
    stroke.changed = false;
    stroke.before = state.pixels.slice();
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) { /* capture is best effort */ }
    moveStroke(ev);
  }

  function moveStroke(ev) {
    if (!stroke.active || ev.pointerId !== stroke.id) { return; }
    var cell = cellFromPointer(ev);
    /* Only a degenerate rect gives up: there is nothing to map against. */
    if (!cell) { return; }
    var value = strokeValue();
    var changed;
    if (stroke.last) {
      changed = line(stroke.last.x, stroke.last.y, cell.x, cell.y, value);
    } else {
      changed = write(cell.x, cell.y, value);
    }
    stroke.last = cell;
    if (changed) {
      stroke.changed = true;
      render();
    }
  }

  function endStroke(ev) {
    if (!stroke.active) { return; }
    if (ev && ev.pointerId !== undefined && ev.pointerId !== stroke.id) { return; }
    stroke.active = false;
    stroke.last = null;
    stroke.id = -1;
    if (stroke.changed) {
      state.undo = stroke.before;
      syncControls();
      saveState();
    }
    stroke.changed = false;
    stroke.before = null;
  }

  canvas.addEventListener('pointerdown', function (ev) {
    /* Only a primary button paints: a right or middle press must not draw,
       and must not arm undo behind the context menu. */
    if (ev.button !== 0) { return; }
    ev.preventDefault();
    beginStroke(ev);
  });
  /* "Save image as" on the artboard must not also edit it. */
  canvas.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  canvas.addEventListener('pointermove', moveStroke);
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  /* A release outside the window fires only this one on some builds. */
  canvas.addEventListener('lostpointercapture', endStroke);

  /* ---------- tools ---------- */

  var paletteEl = document.getElementById('palette');
  var eraseBtn = document.getElementById('erase');
  var mirrorBtn = document.getElementById('mirror');
  var undoBtn = document.getElementById('undo');
  var clearBtn = document.getElementById('clear');
  var swatches = [];

  function setColor(i) {
    state.color = i;
    state.erase = false;
    syncControls();
    saveState();
    setStatus(restingText());
  }

  function toggleErase() {
    state.erase = !state.erase;
    syncControls();
    saveState();
    setStatus(restingText());
  }

  function toggleMirror() {
    state.mirror = !state.mirror;
    syncControls();
    render();
    saveState();
    /* Mirror on lands on the resting text, so the explanation stays put. */
    setStatus(state.mirror ? restingText() : 'Mirror off.');
  }

  /* Exactly one step, one stroke deep. */
  function undo() {
    if (!state.undo) { return; }
    state.pixels.set(state.undo);
    state.undo = null;
    /* Undo is about to disable itself and drop focus to <body>. Hand focus to
       its neighbour first, but only if it was actually holding it. */
    if (document.activeElement === undoBtn) { clearBtn.focus(); }
    syncControls();
    render();
    saveState();
    setStatus('Undone.');
  }

  /* Clear counts as a stroke, so Undo brings the sprite back. */
  function clearBoard() {
    var before = state.pixels.slice();
    var empty = true;
    for (var i = 0; i < state.pixels.length; i++) {
      if (state.pixels[i] !== 0) { empty = false; break; }
    }
    /* An already-empty board is not cleared: do not announce it and do not
       write a record for it. */
    if (!empty) {
      state.pixels.fill(0);
      state.undo = before;
      syncControls();
      render();
      saveState();
      setStatus('Cleared.');
    }
  }

  function syncControls() {
    /* The ring means "this is the armed colour", not "you are painting right
       now": erase mode used to blank it, leaving nothing on screen to say what
       colour comes back when Erase is switched off. The solid Erase pill
       carries the mode on its own. */
    for (var i = 0; i < swatches.length; i++) {
      swatches[i].setAttribute('aria-pressed', state.color === i + 1 ? 'true' : 'false');
    }
    eraseBtn.setAttribute('aria-pressed', state.erase ? 'true' : 'false');
    mirrorBtn.setAttribute('aria-pressed', state.mirror ? 'true' : 'false');
    undoBtn.disabled = !state.undo;
  }

  /* ---------- export ---------- */

  var exportBtn = document.getElementById('export');
  var scrim = document.getElementById('scrim');
  var shot = document.getElementById('shot');
  var downloadLink = document.getElementById('download');
  var closeBtn = document.getElementById('close');
  var panelEl = scrim.querySelector('.panel');
  var hintEl = document.getElementById('hint');
  var HINT = hintEl.textContent;

  /* 16x16 blocks filled on a 256x256 canvas: no upscaling, so no smoothing
     question, and empty cells are never touched so they stay transparent. */
  function toPng() {
    var off = document.createElement('canvas');
    off.width = 256;
    off.height = 256;
    var octx = off.getContext('2d');
    for (var y = 0; y < GRID; y++) {
      for (var x = 0; x < GRID; x++) {
        var v = state.pixels[y * GRID + x];
        if (v === 0) { continue; }
        octx.fillStyle = PALETTE[v];
        octx.fillRect(x * 16, y * 16, 16, 16);
      }
    }
    return off.toDataURL('image/png');
  }

  function openExport() {
    /* A second finger can open the panel while the first is still painting.
       End the stroke first, or the PNG is built from a board that keeps
       changing underneath the picture of it. */
    endStroke();
    var uri = toPng();
    shot.src = uri;
    downloadLink.href = uri;
    scrim.hidden = false;
    /* The panel exists to show the sprite: it has to open at its own top, and
       focusing Close must not scroll it away. */
    scrim.scrollTop = 0;
    closeBtn.focus({ preventScroll: true });
  }

  function closeExport() {
    if (scrim.hidden) { return; }
    scrim.hidden = true;
    hintEl.textContent = HINT;
    exportBtn.focus();
  }

  /* The panel says aria-modal, so focus has to behave that way: with the page
     behind it still reachable, Tab could land on Undo and wipe the board while
     the panel showed the old sprite. */
  function trapTab(ev) {
    if (scrim.hidden || ev.key !== 'Tab') { return; }
    var stops = panelEl.querySelectorAll('a[href], button:not([disabled])');
    if (!stops.length) { return; }
    var first = stops[0];
    var last = stops[stops.length - 1];
    var here = document.activeElement;
    if (!panelEl.contains(here)) {
      ev.preventDefault();
      (ev.shiftKey ? last : first).focus();
    } else if (ev.shiftKey && here === first) {
      ev.preventDefault();
      last.focus();
    } else if (!ev.shiftKey && here === last) {
      ev.preventDefault();
      first.focus();
    }
  }

  /* ---------- control activation ---------- */

  /* Chromium only synthesises a click for the primary touch pointer, so with a
     finger resting on the board a second finger tapping a button got
     pointerdown and pointerup but no click, and every control was dead until
     the first finger lifted. Non-primary touch taps are activated from
     pointerup instead, and the click that may still follow is swallowed.
     The swallow is disarmed two ways — by the click it was meant for, and by
     the next press on the control — so a click that never arrives can never
     leave the control dead. */
  var TOUCH_CLICK_WINDOW = 500;

  function over(el, ev) {
    /* Touch takes implicit pointer capture, so pointerup lands here even when
       the finger has slid away. A release outside the box is not a tap. */
    var r = el.getBoundingClientRect();
    return ev.clientX >= r.left && ev.clientX <= r.right &&
           ev.clientY >= r.top && ev.clientY <= r.bottom;
  }

  function onActivate(el, fn) {
    var downId = -1;
    var firedAt = 0;
    el.addEventListener('pointerdown', function (ev) {
      /* A fresh press: any swallow still pending belongs to an older tap. */
      firedAt = 0;
      if (ev.pointerType === 'touch' && !ev.isPrimary) { downId = ev.pointerId; }
    });
    el.addEventListener('pointercancel', function (ev) {
      if (ev.pointerId === downId) { downId = -1; }
    });
    el.addEventListener('pointerup', function (ev) {
      if (ev.pointerId !== downId) { return; }
      downId = -1;
      if (ev.pointerType !== 'touch' || ev.isPrimary || el.disabled) { return; }
      if (!over(el, ev)) { return; }
      firedAt = Date.now();
      fn(ev);
    });
    el.addEventListener('click', function (ev) {
      if (firedAt && Date.now() - firedAt < TOUCH_CLICK_WINDOW) { firedAt = 0; return; }
      firedAt = 0;
      fn(ev);
    });
  }

  function buildUI() {
    for (var i = 1; i < PALETTE.length; i++) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'sw';
      /* The white swatch needs a hairline so it is visible against the page. */
      if (i === 4) { b.className += ' hairline'; }
      b.style.background = PALETTE[i];
      b.setAttribute('aria-pressed', 'false');
      b.setAttribute('aria-label', COLOUR_NAMES[i]);
      (function (idx) {
        onActivate(b, function () { setColor(idx); });
      }(i));
      paletteEl.appendChild(b);
      swatches.push(b);
    }
    onActivate(eraseBtn, toggleErase);
    onActivate(mirrorBtn, toggleMirror);
    onActivate(undoBtn, undo);
    onActivate(clearBtn, clearBoard);
    onActivate(exportBtn, openExport);
    onActivate(closeBtn, closeExport);
    downloadLink.addEventListener('click', function () {
      /* Confirm where the reader is: the panel covers the status line. */
      hintEl.textContent = 'Saved as sprite.png.';
      setStatus('Saved as sprite.png.');
    });
    scrim.addEventListener('click', function (ev) {
      if (ev.target === scrim) { closeExport(); }
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { closeExport(); }
    });
    document.addEventListener('keydown', trapTab, true);
    /* Belt and braces: anything that lands outside the open panel comes back. */
    document.addEventListener('focusin', function (ev) {
      if (!scrim.hidden && !panelEl.contains(ev.target)) { closeBtn.focus(); }
    });
    syncControls();
  }

  /* ---------- resize / rotate / devicePixelRatio ---------- */

  function relayout() {
    measure();
    render();
  }

  var dprQuery = null;
  function onDprChange() {
    relayout();
    watchDpr();
  }
  function watchDpr() {
    try {
      if (dprQuery && dprQuery.removeEventListener) {
        dprQuery.removeEventListener('change', onDprChange);
      }
      dprQuery = window.matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
      if (dprQuery.addEventListener) {
        dprQuery.addEventListener('change', onDprChange);
      }
    } catch (e) { /* matchMedia is optional here; resize still covers it. */ }
  }

  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', relayout);
  watchDpr();

  loadState();
  buildUI();
  /* A restored erase mode has to be readable on the cold page too. Only
     touched when it differs, so the live region stays quiet on load. */
  if (statusEl.textContent !== restingText()) { setStatus(restingText()); }
  relayout();
}());
</script>
</body>
</html>
